name: Assemble package-lock
on:
  push:
    paths:
      - ".github/workflows/assemble-lockfile.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Decode lockfile and commit
        run: |
          python3 <<'PY'
          import base64, gzip, hashlib, json, os
          parts = []
          for i in range(7):
              p = open(f".ci/lock.gz.b64.{i:02d}").read().strip()
              if len(p) > 12796:
                  p = p[:12796]
              parts.append(p)
          c = []
          for i in range(4):
              t = open(f".ci/lock.gz.b64.07.{i}").read().strip()
              if i == 2 and len(t) == 3198:
                  t = t[:1925] + "u" + t[1925:]
              c.append(t)
          parts.append("".join(c))
          p = list(parts[1]); p[1597] = "v"; parts[1] = "".join(p)
          p = list(parts[5])
          p[3586] = "m"; p[8895] = "i"; p[8896] = "k"; p[11024] = "j"
          parts[5] = "".join(p)
          blob = "".join(parts)
          assert len(blob) == 102368
          raw = gzip.decompress(base64.b64decode(blob))
          assert hashlib.sha256(raw).hexdigest() == "b01f676541e8855564c499397b1022162f5d6c0cf985e5db317d3f9e15cd8cb5"
          json.loads(raw)
          open("package-lock.json", "wb").write(raw)
          print("wrote package-lock.json", len(raw))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm -r .ci
          git rm .github/workflows/assemble-lockfile.yml
          git commit -m "Add package-lock.json for reproducible npm ci deploys"
          git push
