services:
  - type: web
    name: kunststofgevel-website
    runtime: node
    # Paid plan so the shop does not spin down. Region is Frankfurt.
    # Changing region on an existing Render service may require a new service. This file is config only.
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_STOREFRONT_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2025-01"
      - key: ACTIVECAMPAIGN_API_URL
        sync: false
      - key: ACTIVECAMPAIGN_API_KEY
        sync: false
      - key: ACTIVECAMPAIGN_LIST_ID
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: LEAD_EMAIL_TO
        value: info@kunststof-gevel.nl
      - key: LEAD_EMAIL_FROM
        value: info@kunststof-gevel.nl
      - key: LEAD_EMAIL_PROVIDER
        value: smtp
      - key: RESEND_API_KEY
        sync: false
      - key: MAILERSEND_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: info@kunststof-gevel.nl
      - key: SMTP_PASS
        sync: false
      - key: NEXT_PUBLIC_GTM_ID
        value: GTM-N3DQ6G5
      - key: NOINDEX
        sync: false
